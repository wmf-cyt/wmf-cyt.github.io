<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>6的密碼解鎖戰 | Divisibility Challenge (Divide by 6)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117;
            color: #f0f6fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            touch-action: manipulation;
        }

        .game-container {
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            padding: 28px 24px;
            text-align: center;
            width: 100%;
            max-width: 460px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        h1 {
            color: #ec4899;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(236, 72, 153, 0.3);
        }

        .subtitle {
            color: #8b949e;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 22px;
        }

        .screen {
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.25s ease-out forwards;
        }

        .hidden {
            display: none !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-box {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 18px 16px;
            text-align: left;
            color: #c9d1d9;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .welcome-box p {
            margin-bottom: 10px;
        }

        .welcome-box p:last-child {
            margin-bottom: 0;
        }

        .welcome-box strong {
            color: #58a6ff;
        }

        .rule-card {
            background: rgba(88, 166, 255, 0.1);
            border-left: 4px solid #58a6ff;
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 6px;
            font-size: 13px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-label {
            color: #8b949e;
            font-size: 13px;
        }

        .stat-val {
            color: #58a6ff;
        }

        .number-display {
            font-size: 42px;
            font-weight: 800;
            color: #3fb950;
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 22px 12px;
            border-radius: 16px;
            letter-spacing: 2px;
            word-break: break-all;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            min-height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hint-box {
            min-height: 52px;
            color: #d29922;
            font-size: 13px;
            font-weight: 600;
            background: rgba(210, 153, 34, 0.1);
            border: 1px dashed rgba(210, 153, 34, 0.35);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.96);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .btn-start {
            background: #238636;
            color: #ffffff;
            width: 100%;
            padding: 16px;
            font-size: 18px;
        }

        .btn-start:hover {
            background: #2ea043;
        }

        .btn-yes {
            flex: 1;
            background: #1f6feb;
            color: #ffffff;
        }

        .btn-yes:hover {
            background: #388bfd;
        }

        .btn-no {
            flex: 1;
            background: #da3633;
            color: #ffffff;
        }

        .btn-no:hover {
            background: #f85149;
        }

        .btn-hint {
            background: #8957e5;
            color: #ffffff;
            width: 100%;
            padding: 11px;
            font-size: 14px;
        }

        .btn-hint:hover {
            background: #a371f7;
        }

        .btn-restart {
            background: #da3633;
            color: #ffffff;
            width: 100%;
            padding: 14px;
            margin-top: 8px;
        }

        .btn-restart:hover {
            background: #f85149;
        }

        .feedback {
            font-size: 16px;
            font-weight: 700;
            min-height: 24px;
            margin-top: 4px;
            text-align: center;
        }

        .correct { color: #3fb950; }
        .wrong { color: #f85149; }

        .result-card {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 8px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            color: #8b949e;
        }

        .result-value {
            font-weight: 700;
            color: #f0f6fc;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>密碼解鎖戰：6的整除性</h1>
    <div class="subtitle">中一數學微練習 (Divisibility Challenge)</div>

    <!-- 開始畫面 -->
    <div id="start-screen" class="screen">
        <div class="welcome-box">
            <p><strong>挑戰規則：</strong></p>
            <p>⏱️ 限時 30 秒內，判斷顯示的數字能否被 6 整除。</p>
            <div class="rule-card">
                <p>💡 <strong>6的整除條件（雙重檢測法）：</strong></p>
                <p>1️⃣ <strong>偶數檢測：</strong>末位數字必須是 0, 2, 4, 6, 8。</p>
                <p>2️⃣ <strong>3的倍數檢測：</strong>所有位數相加之和能被 3 整除。</p>
                <p style="margin-top: 4px; color: #ec4899;">⚠️ 兩者必須同時滿足才可被 6 整除！</p>
            </div>
            <p style="margin-top: 10px;">🔥 連續答對可觸發 Combo 加分機制！</p>
        </div>
        <button class="btn-start" id="btn-start">🚀 開始挑戰</button>
    </div>

    <!-- 遊戲畫面 -->
    <div id="game-screen" class="screen hidden">
        <div class="stats-bar">
            <div class="stat-item"><span class="stat-label">分數:</span> <span class="stat-val" id="score">0</span></div>
            <div class="stat-item"><span class="stat-label">倒數:</span> <span class="stat-val" id="timer" style="color: #f85149;">30</span>s</div>
            <div class="stat-item"><span class="stat-label">Combo:</span> <span class="stat-val" id="combo" style="color: #d29922;">0</span></div>
        </div>

        <div class="number-display" id="current-number">---</div>
        
        <div class="hint-box" id="hint-text">請檢查：1. 是否為偶數？ 2. 數字和能否被3整除？</div>

        <div class="btn-group">
            <button class="btn-yes" id="btn-yes">可以整除 (YES)</button>
            <button class="btn-no" id="btn-no">不能整除 (NO)</button>
        </div>

        <button class="btn-hint" id="btn-hint">💡 提示 (雙重條件分析)</button>
        <div class="feedback" id="feedback"></div>
    </div>

    <!-- 結算畫面 -->
    <div id="result-screen" class="screen hidden">
        <h2 style="color: #58a6ff; font-size: 20px;">任務結束！</h2>
        
        <div class="result-card">
            <div class="result-row">
                <span>最終得分</span>
                <span class="result-value" id="final-score" style="font-size: 26px; color: #3fb950;">0</span>
            </div>
            <div class="result-row">
                <span>答對題數</span>
                <span class="result-value"><span id="correct-count">0</span> / <span id="total-count">0</span></span>
            </div>
            <div class="result-row">
                <span>稱號評級</span>
                <span class="result-value" id="rank-text" style="color: #d29922;">-</span>
            </div>
        </div>

        <button class="btn-restart" id="btn-restart">🔄 再玩一次</button>
    </div>
</div>

<script>
    let score = 0;
    let timeLeft = 30;
    let timer = null;
    let currentNum = 0;
    let isDivisibleBy6 = false;
    let combo = 0;
    let totalAnswered = 0;
    let correctAnswers = 0;

    // 開啟/重設遊戲狀態
    function startGame() {
        score = 0;
        timeLeft = 30;
        combo = 0;
        totalAnswered = 0;
        correctAnswers = 0;

        document.getElementById('score').innerText = score;
        document.getElementById('combo').innerText = combo;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('feedback').innerText = '';
        
        // 切換畫面
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('result-screen').classList.add('hidden');

        nextQuestion();

        if (timer) clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    // 隨機生成 3 到 6 位數的大數字
    function generateNumber() {
        const digits = Math.floor(Math.random() * 4) + 3; // 3 到 6 位數
        const min = Math.pow(10, digits - 1);
        const max = Math.pow(10, digits) - 1;
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // 出下一題
    function nextQuestion() {
        currentNum = generateNumber();
        document.getElementById('current-number').innerText = currentNum.toLocaleString();
        
        // 判斷是否能被 6 整除
        isDivisibleBy6 = (currentNum % 6 === 0);
        
        document.getElementById('hint-text').innerText = '請檢查：1. 是否為偶數？ 2. 數字和能否被3整除？';
    }

    // 顯示提示（包含偶數與 3 的整除性詳細分析）
    function showHint() {
        const numStr = currentNum.toString();
        const lastDigit = parseInt(numStr[numStr.length - 1]);
        const isEven = (lastDigit % 2 === 0);
        
        const digitsArray = numStr.split('');
        const sum = digitsArray.reduce((a, b) => parseInt(a) + parseInt(b), 0);
        const isDiv3 = (sum % 3 === 0);

        const evenText = isEven ? `✅ 末位是 ${lastDigit} (是偶數)` : `❌ 末位是 ${lastDigit} (非偶數)`;
        const div3Text = isDiv3 ? `✅ 數字和=${sum} (可被3整除)` : `❌ 數字和=${sum} (不可被3整除)`;

        document.getElementById('hint-text').innerHTML = `💡 提示：<br>${evenText} | ${div3Text}`;
    }

    // 檢查玩家選擇
    function checkAnswer(userAnswer) {
        if (timeLeft <= 0) return;
        
        totalAnswered++;
        const feedbackEl = document.getElementById('feedback');

        if (userAnswer === isDivisibleBy6) {
            combo++;
            correctAnswers++;
            let points = 100 + (combo > 1 ? (combo - 1) * 20 : 0);
            score += points;
            feedbackEl.innerText = `✅ 正確！+${points}分`;
            feedbackEl.className = 'feedback correct';
        } else {
            combo = 0;
            score = Math.max(0, score - 50);
            feedbackEl.innerText = `❌ 錯誤！-50分`;
            feedbackEl.className = 'feedback wrong';
        }

        document.getElementById('score').innerText = score;
        document.getElementById('combo').innerText = combo;

        nextQuestion();
    }

    // 結束遊戲
    function endGame() {
        clearInterval(timer);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        document.getElementById('final-score').innerText = score;
        document.getElementById('correct-count').innerText = correctAnswers;
        document.getElementById('total-count').innerText = totalAnswered;

        let rank = '初級解密員 🔰';
        if (score >= 1500) rank = 'S級 6的密碼大師 🏆';
        else if (score >= 1000) rank = 'A級 雙重檢測專家 🥇';
        else if (score >= 500) rank = 'B級 資深解密員 🥈';
        
        document.getElementById('rank-text').innerText = rank;
    }

    // 綁定按鈕點擊事件
    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-yes').addEventListener('click', () => checkAnswer(true));
    document.getElementById('btn-no').addEventListener('click', () => checkAnswer(false));
    document.getElementById('btn-hint').addEventListener('click', showHint);
    document.getElementById('btn-restart').addEventListener('click', startGame);
</script>
</body>
</html>
