<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>9的密碼解鎖戰 | Divisibility Challenge (Divide by 9)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            touch-action: manipulation;
        }

        .game-container {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            padding: 24px;
            text-align: center;
            width: 100%;
            max-width: 460px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        h1 {
            color: #e94560;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(233, 69, 96, 0.4);
        }

        .subtitle {
            color: #8d99ae;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .screen {
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.25s ease-out forwards;
        }

        .hidden {
            display: none !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-box {
            background-color: #0f3460;
            border: 1px solid #1f4068;
            border-radius: 14px;
            padding: 18px 16px;
            text-align: left;
            color: #dcdde1;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .welcome-box p {
            margin-bottom: 10px;
        }

        .welcome-box p:last-child {
            margin-bottom: 0;
        }

        .welcome-box strong {
            color: #4ecca3;
        }

        .rule-card {
            background: rgba(78, 204, 163, 0.1);
            border-left: 4px solid #4ecca3;
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 13px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f3460;
            border: 1px solid #1f4068;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-label {
            color: #8d99ae;
            font-size: 13px;
        }

        .stat-val {
            color: #4ecca3;
        }

        .number-display {
            font-size: 40px;
            font-weight: 800;
            color: #4ecca3;
            background: #0f3460;
            border: 1px solid #1f4068;
            padding: 20px 12px;
            border-radius: 16px;
            letter-spacing: 2px;
            word-break: break-all;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 修正後的提示框樣式，確保完美對齊與排版 */
        .hint-box {
            min-height: 68px;
            background: rgba(241, 196, 15, 0.08);
            border: 1.5px dashed rgba(241, 196, 15, 0.4);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            text-align: center;
            font-size: 14px;
            color: #f1c40f;
            box-sizing: border-box;
            width: 100%;
        }

        .hint-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            line-height: 1.4;
            width: 100%;
        }

        .hint-highlight {
            color: #ffffff;
            font-weight: 700;
        }

        .hint-badge-pass {
            color: #2ec4b6;
            font-weight: 700;
        }

        .hint-badge-fail {
            color: #e71d36;
            font-weight: 700;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.96);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .btn-start {
            background: #2ec4b6;
            color: #ffffff;
            width: 100%;
            padding: 16px;
            font-size: 18px;
        }

        .btn-start:hover {
            background: #26a69a;
        }

        .btn-yes {
            flex: 1;
            background: #2ec4b6;
            color: #ffffff;
        }

        .btn-yes:hover {
            background: #26a69a;
        }

        .btn-no {
            flex: 1;
            background: #e71d36;
            color: #ffffff;
        }

        .btn-no:hover {
            background: #c0172b;
        }

        .btn-hint {
            background: #ff9f1c;
            color: #ffffff;
            width: 100%;
            padding: 11px;
            font-size: 14px;
        }

        .btn-hint:hover {
            background: #e08b12;
        }

        .btn-restart {
            background: #e94560;
            color: #ffffff;
            width: 100%;
            padding: 14px;
            margin-top: 8px;
        }

        .btn-restart:hover {
            background: #d0334d;
        }

        .feedback {
            font-size: 16px;
            font-weight: 700;
            min-height: 24px;
            margin-top: 2px;
            text-align: center;
        }

        .correct { color: #2ec4b6; }
        .wrong { color: #e71d36; }

        .result-card {
            background: #0f3460;
            border: 1px solid #1f4068;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 8px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            color: #8d99ae;
        }

        .result-value {
            font-weight: 700;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>密碼解鎖戰：9的整除性</h1>
    <div class="subtitle">中一數學微練習 (Divisibility Challenge)</div>

    <!-- 開始畫面 -->
    <div id="start-screen" class="screen">
        <div class="welcome-box">
            <p><strong>挑戰規則：</strong></p>
            <p>⏱️ 限時 30 秒內，判斷顯示的數字能否被 9 整除。</p>
            <div class="rule-card">
                <p>💡 <strong>9的整除條件（數位求和法）：</strong></p>
                <p>將該數的<strong>所有數位相加</strong>，若數字加總能被 9 整除（即為 9 的倍數），該數就能被 9 整除！</p>
            </div>
            <p style="margin-top: 10px;">🔥 連續答對可觸發 Combo 加分機制！</p>
        </div>
        <button class="btn-start" id="btn-start">🚀 開始挑戰</button>
    </div>

    <!-- 遊戲畫面 -->
    <div id="game-screen" class="screen hidden">
        <div class="stats-bar">
            <div class="stat-item"><span class="stat-label">分數:</span> <span class="stat-val" id="score">0</span></div>
            <div class="stat-item"><span class="stat-label">倒數:</span> <span class="stat-val" id="timer" style="color: #e71d36;">30</span>s</div>
            <div class="stat-item"><span class="stat-label">Combo:</span> <span class="stat-val" id="combo" style="color: #ff9f1c;">0</span></div>
        </div>

        <div class="number-display" id="current-number">---</div>
        
        <!-- 優化後的提示區域結構 -->
        <div class="hint-box" id="hint-box">
            <div class="hint-line">請快速計算：所有數位相加之和能否被 9 整除？</div>
        </div>

        <div class="btn-group">
            <button class="btn-yes" id="btn-yes">可以整除 (YES)</button>
            <button class="btn-no" id="btn-no">不能整除 (NO)</button>
        </div>

        <button class="btn-hint" id="btn-hint">💡 提示 (數位求和分析)</button>
        <div class="feedback" id="feedback"></div>
    </div>

    <!-- 結算畫面 -->
    <div id="result-screen" class="screen hidden">
        <h2 style="color: #4ecca3; font-size: 20px;">任務結束！</h2>
        
        <div class="result-card">
            <div class="result-row">
                <span>最終得分</span>
                <span class="result-value" id="final-score" style="font-size: 26px; color: #2ec4b6;">0</span>
            </div>
            <div class="result-row">
                <span>答對題數</span>
                <span class="result-value"><span id="correct-count">0</span> / <span id="total-count">0</span></span>
            </div>
            <div class="result-row">
                <span>稱號評級</span>
                <span class="result-value" id="rank-text" style="color: #f1c40f;">-</span>
            </div>
        </div>

        <button class="btn-restart" id="btn-restart">🔄 再玩一次</button>
    </div>
</div>

<script>
    let score = 0;
    let timeLeft = 30;
    let timer = null;
    let currentNum = 0;
    let isDivisibleBy9 = false;
    let combo = 0;
    let totalAnswered = 0;
    let correctAnswers = 0;

    // 開啟/重設遊戲狀態
    function startGame() {
        score = 0;
        timeLeft = 30;
        combo = 0;
        totalAnswered = 0;
        correctAnswers = 0;

        document.getElementById('score').innerText = score;
        document.getElementById('combo').innerText = combo;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('feedback').innerText = '';
        
        // 切換畫面
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('result-screen').classList.add('hidden');

        nextQuestion();

        if (timer) clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    // 隨機生成 3 到 6 位數，並控制大約 50% 機率為 9 的倍數
    function generateNumber() {
        const digits = Math.floor(Math.random() * 4) + 3; // 3 到 6 位數
        const min = Math.pow(10, digits - 1);
        const max = Math.pow(10, digits) - 1;
        let num = Math.floor(Math.random() * (max - min + 1)) + min;

        // 50% 機率強制產生能被 9 整除的數字
        const shouldBeDivisible = Math.random() < 0.5;

        if (shouldBeDivisible) {
            const remainder = num % 9;
            if (remainder !== 0) {
                // 將數字調整為最接近的 9 的倍數
                num += (9 - remainder);
                // 若超越位數邊界則減去 9
                if (num > max) {
                    num -= 9;
                }
            }
        } else {
            // 強制產生不能被 9 整除的數字
            if (num % 9 === 0) {
                num += Math.floor(Math.random() * 8) + 1; // 加上 1~8 之間的偏移
                if (num > max) {
                    num -= 9;
                }
            }
        }

        return num;
    }

    // 出下一題
    function nextQuestion() {
        currentNum = generateNumber();
        document.getElementById('current-number').innerText = currentNum.toLocaleString();
        
        // 判斷是否能被 9 整除
        isDivisibleBy9 = (currentNum % 9 === 0);
        
        // 重置提示框為預設提示
        document.getElementById('hint-box').innerHTML = `
            <div class="hint-line">請快速計算：所有數位相加之和能否被 9 整除？</div>
        `;
    }

    // 顯示格式修復後的提示
    function showHint() {
        const numStr = currentNum.toString();
        const digitsArray = numStr.split('');
        const sum = digitsArray.reduce((a, b) => parseInt(a) + parseInt(b), 0);
        const formula = digitsArray.join(' + ');
        const isDiv = (sum % 9 === 0);

        if (isDiv) {
            const quotient = sum / 9;
            document.getElementById('hint-box').innerHTML = `
                <div class="hint-line">
                    💡 <strong>數位求和：</strong> ${formula} = <span class="hint-highlight">${sum}</span>
                </div>
                <div class="hint-line hint-badge-pass">
                    ✅ ${sum} ÷ 9 = ${quotient} (可以被 9 整除)
                </div>
            `;
        } else {
            const rem = sum % 9;
            document.getElementById('hint-box').innerHTML = `
                <div class="hint-line">
                    💡 <strong>數位求和：</strong> ${formula} = <span class="hint-highlight">${sum}</span>
                </div>
                <div class="hint-line hint-badge-fail">
                    ❌ ${sum} 不能被 9 整除 (餘數為 ${rem})
                </div>
            `;
        }
    }

    // 檢查玩家選擇
    function checkAnswer(userAnswer) {
        if (timeLeft <= 0) return;
        
        totalAnswered++;
        const feedbackEl = document.getElementById('feedback');

        if (userAnswer === isDivisibleBy9) {
            combo++;
            correctAnswers++;
            let points = 100 + (combo > 1 ? (combo - 1) * 20 : 0);
            score += points;
            feedbackEl.innerText = `✅ 正確！+${points}分`;
            feedbackEl.className = 'feedback correct';
        } else {
            combo = 0;
            score = Math.max(0, score - 50);
            feedbackEl.innerText = `❌ 錯誤！-50分`;
            feedbackEl.className = 'feedback wrong';
        }

        document.getElementById('score').innerText = score;
        document.getElementById('combo').innerText = combo;

        nextQuestion();
    }

    // 結束遊戲
    function endGame() {
        clearInterval(timer);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        document.getElementById('final-score').innerText = score;
        document.getElementById('correct-count').innerText = correctAnswers;
        document.getElementById('total-count').innerText = totalAnswered;

        let rank = '初級解密員 🔰';
        if (score >= 1500) rank = 'S級 9的密碼大師 🏆';
        else if (score >= 1000) rank = 'A級 數位求和專家 🥇';
        else if (score >= 500) rank = 'B級 資深解密員 🥈';
        
        document.getElementById('rank-text').innerText = rank;
    }

    // 綁定按鈕點擊事件
    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-yes').addEventListener('click', () => checkAnswer(true));
    document.getElementById('btn-no').addEventListener('click', () => checkAnswer(false));
    document.getElementById('btn-hint').addEventListener('click', showHint);
    document.getElementById('btn-restart').addEventListener('click', startGame);
</script>
</body>
</html>
