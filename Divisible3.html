<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3的密碼解鎖戰 | Divisibility Challenge</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: #16213e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 2px solid #0f3460;
        }
        h1 {
            color: #e94560;
            margin-bottom: 5px;
            font-size: 24px;
        }
        .subtitle {
            color: #8d99ae;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #0f3460;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: bold;
        }
        .number-display {
            font-size: 48px;
            font-weight: bold;
            color: #4ecca3;
            background: #0f3460;
            padding: 20px;
            border-radius: 10px;
            letter-spacing: 3px;
            margin-bottom: 15px;
            word-break: break-all;
        }
        .hint-box {
            min-height: 40px;
            color: #f1c40f;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-yes {
            background-color: #2ec4b6;
            color: #fff;
        }
        .btn-yes:hover { background-color: #20a396; }
        .btn-no {
            background-color: #e71d36;
            color: #fff;
        }
        .btn-no:hover { background-color: #c4142b; }
        .btn-hint {
            background-color: #ff9f1c;
            color: #fff;
            width: 100%;
            padding: 10px;
            font-size: 14px;
        }
        .btn-restart {
            background-color: #e94560;
            color: white;
            width: 100%;
            margin-top: 15px;
        }
        .feedback {
            font-size: 18px;
            font-weight: bold;
            height: 25px;
            margin-top: 10px;
        }
        .correct { color: #2ec4b6; }
        .wrong { color: #e71d36; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>密碼解鎖戰：3的整除性</h1>
    <div class="subtitle">中一數學微練習</div>

    <!-- 遊戲主介面 -->
    <div id="game-screen">
        <div class="stats-bar">
            <span>分數: <span id="score">0</span></span>
            <span>倒數: <span id="timer">30</span>s</span>
            <span>Combo: <span id="combo">0</span></span>
        </div>

        <div class="number-display" id="current-number">---</div>
        
        <div class="hint-box" id="hint-text">點擊下方按鈕開始判斷！</div>

        <div class="btn-group">
            <button class="btn-yes" onclick="checkAnswer(true)">可以整除 (YES)</button>
            <button class="btn-no" onclick="checkAnswer(false)">不能整除 (NO)</button>
        </div>

        <button class="btn-hint" onclick="showHint()">💡 提示 (位數求和法)</button>
        <div class="feedback" id="feedback"></div>
    </div>

    <!-- 遊戲結算畫面 -->
    <div id="result-screen" class="hidden">
        <h2>任務結束！</h2>
        <p>最終得分：<span id="final-score" style="font-size: 24px; color: #4ecca3; font-weight:bold;">0</span></p>
        <p>答對題數：<span id="correct-count">0</span> / <span id="total-count">0</span></p>
        <p>評級：<span id="rank-text" style="color: #f1c40f; font-weight:bold;">-</span></p>
        <button class="btn-restart" onclick="startGame()">再玩一次</button>
    </div>
</div>

<script>
    let score = 0;
    let timeLeft = 30;
    let timer = null;
    let currentNum = 0;
    let isDivisble = false;
    let combo = 0;
    let totalAnswered = 0;
    let correctAnswers = 0;

    function startGame() {
        score = 0;
        timeLeft = 30;
        combo = 0;
        totalAnswered = 0;
        correctAnswers = 0;

        document.getElementById('score').innerText = score;
        document.getElementById('combo').innerText = combo;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('feedback').innerText = '';
        
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('result-screen').classList.add('hidden');

        nextQuestion();

        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function generateNumber() {
        // 隨機生成 3 到 6 位數，增加挑戰性
        const digits = Math.floor(Math.random() * 4) + 3; // 3, 4, 5, 6 位數
        const min = Math.pow(10, digits - 1);
        const max = Math.pow(10, digits) - 1;
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function nextQuestion() {
        currentNum = generateNumber();
        document.getElementById('current-number').innerText = currentNum.toLocaleString();
        
        // 判斷是否可被3整除
        isDivisble = (currentNum % 3 === 0);
        
        // 重置提示
        document.getElementById('hint-text').innerText = '請快速估算此數能否被 3 整除';
    }

    function showHint() {
        const sum = currentNum.toString().split('').reduce((a, b) => parseInt(a) + parseInt(b), 0);
        document.getElementById('hint-text').innerText = `提示：數字加總為 ${sum} (${currentNum.toString().split('').join(' + ')})`;
    }

    function checkAnswer(userAnswer) {
        totalAnswered++;
        const feedbackEl = document.getElementById('feedback');

        if (userAnswer === isDivisble) {
            combo++;
            correctAnswers++;
            let points = 100 + (combo > 1 ? (combo - 1) * 20 : 0); // 連擊獎勵
            score += points;
            feedbackEl.innerText = `✅ 正確！+${points}分`;
            feedbackEl.className = 'feedback correct';
        } else {
            combo = 0;
            score = Math.max(0, score - 50); // 答錯扣分
            feedbackEl.innerText = `❌ 錯誤！`;
            feedbackEl.className = 'feedback wrong';
        }

        document.getElementById('score').innerText = score;
        document.getElementById('combo').innerText = combo;

        nextQuestion();
    }

    function endGame() {
        clearInterval(timer);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        document.getElementById('final-score').innerText = score;
        document.getElementById('correct-count').innerText = correctAnswers;
        document.getElementById('total-count').innerText = totalAnswered;

        // 計算評級
        let rank = '初級解密員';
        if (score >= 1500) rank = 'S級 數學密碼大師 🏆';
        else if (score >= 1000) rank = 'A級 進階破譯專家 🥇';
        else if (score >= 500) rank = 'B級 資深解密員 🥈';
        
        document.getElementById('rank-text').innerText = rank;
    }

    // 網頁載入時自動開始
    window.onload = startGame;
</script>

</body>
</html>
