<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10的密碼解鎖戰 | Divisibility Challenge</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            touch-action: manipulation;
        }

        .game-container {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 20px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4);
            padding: 28px 24px;
            text-align: center;
            width: 100%;
            max-width: 440px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        h1 {
            color: #f43f5e;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 22px;
        }

        .screen {
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.25s ease-out forwards;
        }

        .hidden {
            display: none !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 18px 16px;
            text-align: left;
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .welcome-box p {
            margin-bottom: 8px;
        }

        .welcome-box p:last-child {
            margin-bottom: 0;
        }

        .welcome-box strong {
            color: #38bdf8;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 13px;
        }

        .stat-val {
            color: #38bdf8;
        }

        .number-display {
            font-size: 42px;
            font-weight: 800;
            color: #22c55e;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 24px 12px;
            border-radius: 16px;
            letter-spacing: 2px;
            word-break: break-all;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            min-height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hint-box {
            min-height: 44px;
            color: #fbbf24;
            font-size: 14px;
            font-weight: 600;
            background: rgba(251, 191, 36, 0.1);
            border: 1px dashed rgba(251, 191, 36, 0.3);
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.96);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .btn-start {
            background: #22c55e;
            color: #0f172a;
            width: 100%;
            padding: 16px;
            font-size: 18px;
        }

        .btn-start:hover {
            background: #16a34a;
        }

        .btn-yes {
            flex: 1;
            background: #06b6d4;
            color: #ffffff;
        }

        .btn-yes:hover {
            background: #0891b2;
        }

        .btn-no {
            flex: 1;
            background: #f43f5e;
            color: #ffffff;
        }

        .btn-no:hover {
            background: #e11d48;
        }

        .btn-hint {
            background: #8b5cf6;
            color: #ffffff;
            width: 100%;
            padding: 10px;
            font-size: 14px;
        }

        .btn-hint:hover {
            background: #7c3aed;
        }

        .result-btn-group {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-restart {
            background: #f43f5e;
            color: #ffffff;
            flex: 1;
            padding: 14px;
        }

        .btn-restart:hover {
            background: #e11d48;
        }

        .btn-home {
            background: #38bdf8;
            color: #0f172a;
            flex: 1;
            padding: 14px;
        }

        .btn-home:hover {
            background: #0ea5e9;
        }

        .feedback {
            font-size: 16px;
            font-weight: 700;
            min-height: 24px;
            margin-top: 4px;
            text-align: center;
        }

        .correct { color: #22c55e; }
        .wrong { color: #f43f5e; }

        .result-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 8px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            color: #cbd5e1;
        }

        .result-value {
            font-weight: 700;
            color: #f8fafc;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>密碼解鎖戰：10的整除性</h1>
    <div class="subtitle">中一數學微練習</div>

    <div id="start-screen" class="screen">
        <div class="welcome-box">
            <p><strong>挑戰規則：</strong></p>
            <p>⏱️ 限時 30 秒內，判斷顯示的數字能否被 10 整除。</p>
            <p>💡 <strong>判斷秘訣：</strong>只需查看該數的「個位數」，若個位數是 0，該數字即可被 10 整除！</p>
            <p>🔥 連續答對可觸發 Combo 加分機制！</p>
        </div>
        <button class="btn-start" id="btn-start">🚀 開始遊戲</button>
    </div>

    <div id="game-screen" class="screen hidden">
        <div class="stats-bar">
            <div class="stat-item"><span class="stat-label">分數:</span> <span class="stat-val" id="score">0</span></div>
            <div class="stat-item"><span class="stat-label">倒數:</span> <span class="stat-val" id="timer" style="color: #f43f5e;">30</span>s</div>
            <div class="stat-item"><span class="stat-label">Combo:</span> <span class="stat-val" id="combo" style="color: #fbbf24;">0</span></div>
        </div>

        <div class="number-display" id="current-number">---</div>
        
        <div class="hint-box" id="hint-text">請快速估算此數能否被 10 整除！</div>

        <div class="btn-group">
            <button class="btn-yes" id="btn-yes">可以整除 (YES)</button>
            <button class="btn-no" id="btn-no">不能整除 (NO)</button>
        </div>

        <button class="btn-hint" id="btn-hint">💡 提示 (個位數判斷法)</button>
        <div class="feedback" id="feedback"></div>
    </div>

    <div id="result-screen" class="screen hidden">
        <h2 style="color: #38bdf8; font-size: 20px;">任務結束！</h2>
        
        <div class="result-card">
            <div class="result-row">
                <span>最終得分</span>
                <span class="result-value" id="final-score" style="font-size: 26px; color: #22c55e;">0</span>
            </div>
            <div class="result-row">
                <span>答對題數</span>
                <span class="result-value"><span id="correct-count">0</span> / <span id="total-count">0</span></span>
            </div>
            <div class="result-row">
                <span>稱號評級</span>
                <span class="result-value" id="rank-text" style="color: #fbbf24;">-</span>
            </div>
        </div>

        <div class="result-btn-group">
            <button class="btn-restart" id="btn-restart">🔄 再玩一次</button>
            <button class="btn-home" id="btn-home">🏠 返回主頁</button>
        </div>
    </div>
</div>

<script>
    let score = 0;
    let timeLeft = 30;
    let timer = null;
    let currentNum = 0;
    let isDivisble = false;
    let combo = 0;
    let totalAnswered = 0;
    let correctAnswers = 0;

    // Start or restart game timer and state
    function startGame() {
        score = 0;
        timeLeft = 30;
        combo = 0;
        totalAnswered = 0;
        correctAnswers = 0;

        document.getElementById('score').innerText = score;
        document.getElementById('combo').innerText = combo;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('feedback').innerText = '';
        
        // Screen visibility management
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('result-screen').classList.add('hidden');

        nextQuestion();

        if (timer) clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function generateNumber() {
        const digits = Math.floor(Math.random() * 4) + 3; // Generates 3 to 6 digits
        const min = Math.pow(10, digits - 1);
        const max = Math.pow(10, digits) - 1;

        const shouldBeDivisible = Math.random() < 0.5;

        if (shouldBeDivisible) {
            // Pick a random multiple of 10 within the digit range
            const minMultiple = Math.ceil(min / 10);
            const maxMultiple = Math.floor(max / 10);
            const multiple = Math.floor(Math.random() * (maxMultiple - minMultiple + 1)) + minMultiple;
            return multiple * 10;
        } else {
            // Pick a random number that is NOT divisible by 10
            let num;
            do {
                num = Math.floor(Math.random() * (max - min + 1)) + min;
            } while (num % 10 === 0);
            return num;
        }
    }

    function nextQuestion() {
        currentNum = generateNumber();
        document.getElementById('current-number').innerText = currentNum.toLocaleString();
        isDivisble = (currentNum % 10 === 0);
        document.getElementById('hint-text').innerText = '請快速估算此數能否被 10 整除！';
    }

    function showHint() {
        const numStr = currentNum.toString();
        const lastDigit = numStr.slice(-1);
        const isOk = (lastDigit === '0');
        document.getElementById('hint-text').innerText = `💡 提示：個位數 = ${lastDigit}，${isOk ? '是 0，可整除' : '不是 0，不可整除'}`;
    }

    function checkAnswer(userAnswer) {
        if (timeLeft <= 0) return;
        
        totalAnswered++;
        const feedbackEl = document.getElementById('feedback');

        if (userAnswer === isDivisble) {
            combo++;
            correctAnswers++;
            let points = 100 + (combo > 1 ? (combo - 1) * 20 : 0);
            score += points;
            feedbackEl.innerText = `✅ 正確！+${points}分`;
            feedbackEl.className = 'feedback correct';
        } else {
            combo = 0;
            score = Math.max(0, score - 100);
            feedbackEl.innerText = `❌ 錯誤！-100分`;
            feedbackEl.className = 'feedback wrong';
        }

        document.getElementById('score').innerText = score;
        document.getElementById('combo').innerText = combo;

        nextQuestion();
    }

    function endGame() {
        clearInterval(timer);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        document.getElementById('final-score').innerText = score;
        document.getElementById('correct-count').innerText = correctAnswers;
        document.getElementById('total-count').innerText = totalAnswered;

        let rank = '初級解密員 🔰';
        if (score >= 1500) rank = 'S級 數學密碼大師 🏆';
        else if (score >= 1000) rank = 'A級 進階破譯專家 🥇';
        else if (score >= 500) rank = 'B級 資深解密員 🥈';
        
        document.getElementById('rank-text').innerText = rank;
    }

    document.getElementById('btn-start').addEventListener('click', startGame);
    document.getElementById('btn-yes').addEventListener('click', () => checkAnswer(true));
    document.getElementById('btn-no').addEventListener('click', () => checkAnswer(false));
    document.getElementById('btn-hint').addEventListener('click', showHint);
    document.getElementById('btn-restart').addEventListener('click', startGame);
    document.getElementById('btn-home').addEventListener('click', () => {
        window.location.href = 'https://wmf-cyt.github.io';
    });
</script>
</body>
</html>
