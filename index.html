<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數學密碼解鎖戰 | Divisibility Challenge Hub</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a2e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            text-align: center;
        }

        header {
            margin-bottom: 40px;
        }

        .main-title {
            color: #ffffff;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #4ecca3 0%, #2ec4b6 50%, #e94560 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(78, 204, 163, 0.2);
        }

        .subtitle {
            color: #8d99ae;
            font-size: 16px;
            font-weight: 500;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 28px;
            width: 100%;
            margin-bottom: 40px;
        }

        .game-card {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 20px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: #4ecca3;
            box-shadow: 0 18px 35px rgba(78, 204, 163, 0.25);
        }

        .game-card:active {
            transform: scale(0.98);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #0f3460;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 900;
            margin-top: 10px;
            margin-bottom: 24px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .game-card:hover .icon-box {
            transform: scale(1.1);
        }

        .card-3 .icon-box { color: #2ec4b6; border: 2px solid #2ec4b6; }
        .card-6 .icon-box { color: #ff9f1c; border: 2px solid #ff9f1c; }
        .card-9 .icon-box { color: #e94560; border: 2px solid #e94560; }

        .card-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 14px;
            color: #ffffff;
        }

        .card-desc {
            font-size: 14px;
            color: #8d99ae;
            line-height: 1.6;
            margin-bottom: 28px;
            text-align: center;
            min-height: 48px;
        }

        .btn-play {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            border: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .card-3 .btn-play { background: #2ec4b6; color: #ffffff; }
        .card-6 .btn-play { background: #ff9f1c; color: #ffffff; }
        .card-9 .btn-play { background: #e94560; color: #ffffff; }

        .game-card:hover .btn-play {
            filter: brightness(1.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        footer {
            color: #53637b;
            font-size: 13px;
            text-align: center;
            margin-top: auto;
        }

        @media (max-width: 600px) {
            .main-title {
                font-size: 28px;
            }
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 class="main-title">🎮 數學密碼解鎖戰</h1>
            <div class="subtitle">中一數學微練習系列 | 請選擇挑戰遊戲</div>
        </header>

        <main class="cards-grid">
            <!-- 3 的整除性挑戰 -->
            <a href="Divisible3.html" class="game-card card-3">
                <div class="icon-box">÷3</div>
                <h2 class="card-title">3 的密碼解鎖戰</h2>
                <p class="card-desc">運用「數位求和法」，快速計算所有數位加總，判斷數字能否被 3 整除！</p>
                <div class="btn-play">進入遊戲 🚀</div>
            </a>

            <!-- 6 的整除性挑戰 -->
            <a href="Disvisible6.html" class="game-card card-6">
                <div class="icon-box">÷6</div>
                <h2 class="card-title">6 的密碼解鎖戰</h2>
                <p class="card-desc">雙重檢測！必須同時判斷末位是否為「偶數」以及數位和是否能被 3 整除。</p>
                <div class="btn-play">進入遊戲 🚀</div>
            </a>

            <!-- 9 的整除性挑戰 -->
            <a href="Disvisible9.html" class="game-card card-9">
                <div class="icon-box">÷9</div>
                <h2 class="card-title">9 的密碼解鎖戰</h2>
                <p class="card-desc">數位求和總和需為 9 的倍數！</p>
                <div class="btn-play">進入遊戲 🚀</div>
            </a>
        </main>

        <footer>
            <p>wmf-cyt.github.io &copy; 中一數學微練習系列</p>
        </footer>
    </div>

</body>
</html>
